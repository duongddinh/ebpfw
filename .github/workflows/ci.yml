name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Run the direct UFW benchmark in isolated namespaces
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      CLANG: clang-18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install package build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-18 python3
      - name: Build two package versions for this architecture
        run: |
          make deb VERSION=0.0.0~ci1 ARCH=${{ matrix.arch }}
          make deb VERSION=0.0.0~ci2 ARCH=${{ matrix.arch }}
      - name: Verify installation, safe upgrades, configuration retention, and removal
        run: |
          sudo env PATH="$PATH" EBPFW_PACKAGE_TEST=1 sh packaging/test.sh \
            "$PWD/build/packages/ebpfw_0.0.0~ci1_${{ matrix.arch }}.deb" \
            "$PWD/build/packages/ebpfw_0.0.0~ci2_${{ matrix.arch }}.deb"
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLANG: clang-18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install disposable runner dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18 ufw
      - name: Record toolchain
        run: |
          uname -srmo
          "$CLANG" --version
          go version
      - name: Build, race tests, and vet
        run: make all test build/full.test
      - name: Verify service syntax
        run: |
          sudo make install CLANG="$CLANG"
          systemd-analyze verify /usr/lib/systemd/system/ebpfw.service 2>&1 | tee service-check.log
      - name: Kernel verifier and live IPv4/IPv6 tests
        run: |
          sudo env PATH="$PATH" CLANG="$CLANG" EBPFW_UFW_TEST=1 make test-kernel | tee kernel-tests.log
      - name: Direct UFW benchmark (manual opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark
        run: |
          sudo env PATH="$PATH" CLANG="$CLANG" make benchmark | tee ufw-benchmark.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-logs
          path: '*.log'
